name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack for Yarn 1
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Create empty .env
        run: touch .env

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned Release app
        run: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            GCC_OPTIMIZATION_LEVEL=s \
            ASSETCATALOG_COMPILER_OPTIMIZATION=space

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/PocketPal.app Payload/
          zip -r PocketPal-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
