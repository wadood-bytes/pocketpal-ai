
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Restore enriched Markdown native assets
        run: |
          INIT_CWD="$GITHUB_WORKSPACE" \
          node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Create Env.xcconfig
        run: |
          mkdir -p ios/Config
          cat > ios/Config/Env.xcconfig << 'EOF'
          // CI build configuration
          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id
          EOF

      - name: Create dummy .env
        run: |
          cat > .env << 'EOF'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOF

      - name: Create dummy GoogleService-Info.plist
        run: |
          cat > ios/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy-client-id.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy-client-id</string>
            <key>API_KEY</key>
            <string>dummy-api-key-for-ci-builds</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>ai.pocketpal</string>
            <key>PROJECT_ID</key>
            <string>dummy-project-for-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy-project-for-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOF

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Ensure Metal Toolchain
        run: |
          xcrun -sdk iphoneos metal -v || \
          xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned iOS Release
        shell: bash
        run: |
          set -o pipefail

          cd ios

          xcodebuild \
            -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee ../ios-build.log

      - name: Verify compiled app
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/PocketPal.app"

          if [ ! -d "$APP" ]; then
            echo "::error::PocketPal.app was not generated"
            exit 1
          fi

          echo "PocketPal.app successfully generated"
          ls -lh "$APP"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload

          ditto \
            ios/build/Build/Products/Release-iphoneos/PocketPal.app \
            Payload/PocketPal.app

          zip -qry PocketPal-unsigned.ipa Payload

          ls -lh PocketPal-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-IPA
          path: PocketPal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-iOS-build-log
          path: ios-build.log
          if-no-files-found: ignore
