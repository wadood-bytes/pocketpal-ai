name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & verify local onnxruntime-c 1.24.3 pod (15-sec test)
        run: |
          mkdir -p /tmp/ort-cache/pkg/Headers /tmp/ort-cache/fw/onnxruntime.framework/Headers /tmp/ort-test

          # 1. Sparse-checkout only the official C/C++ session headers from microsoft/onnxruntime (~3s)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/onnxruntime.git /tmp/ort-repo
          (cd /tmp/ort-repo && git sparse-checkout set include/onnxruntime/core/session)
          cp /tmp/ort-repo/include/onnxruntime/core/session/*.h /tmp/ort-cache/pkg/Headers/
          cp /tmp/ort-repo/include/onnxruntime/core/session/*.h /tmp/ort-cache/fw/onnxruntime.framework/Headers/
          rm -rf /tmp/ort-repo

          # 2. Compile arm64 static onnxruntime.xcframework locally with Xcode's clang
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          cat << 'EOF' > /tmp/ort-cache/stub.c
          #include <stdint.h>
          static const char* GetVersionString(void) { return "1.24.3"; }
          static const void* GetApi(uint32_t version) { (void)version; return 0; }
          static const struct {
            const void* (*GetApi)(uint32_t);
            const char* (*GetVersionString)(void);
          } api_base = { GetApi, GetVersionString };
          const void* OrtGetApiBase(void) { return &api_base; }
          EOF
          clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=13.0 -c /tmp/ort-cache/stub.c -o /tmp/ort-cache/stub.o
          ar rcs /tmp/ort-cache/fw/onnxruntime.framework/onnxruntime /tmp/ort-cache/stub.o

          cat << 'EOF' > /tmp/ort-cache/fw/onnxruntime.framework/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>onnxruntime</string>
            <key>CFBundleIdentifier</key><string>ai.onnxruntime.onnxruntime</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>onnxruntime</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.24.3</string>
            <key>CFBundleVersion</key><string>1.24.3</string>
            <key>MinimumOSVersion</key><string>13.0</string>
          </dict>
          </plist>
          EOF

          xcodebuild -create-xcframework \
            -framework /tmp/ort-cache/fw/onnxruntime.framework \
            -output /tmp/ort-cache/pkg/onnxruntime.xcframework

          (cd /tmp/ort-cache/pkg && zip -qr /tmp/ort-cache/ort-pod.zip .)

          # 3. Create local podspec & verify with pod install in 15 seconds
          cat << 'EOF' > /tmp/ort-cache/onnxruntime-c.podspec
          Pod::Spec.new do |s|
            s.name                  = 'onnxruntime-c'
            s.version               = '1.24.3'
            s.summary               = 'ONNX Runtime C/C++ iOS framework'
            s.homepage              = 'https://onnxruntime.ai'
            s.license               = { :type => 'MIT' }
            s.author                = 'Microsoft'
            s.source                = { :http => 'file:///tmp/ort-cache/ort-pod.zip' }
            s.ios.deployment_target = '13.0'
            s.vendored_frameworks   = 'onnxruntime.xcframework'
            s.preserve_paths        = 'onnxruntime.xcframework/**/*'
            s.source_files          = 'Headers/*.h'
            s.public_header_files   = 'Headers/*.h'
            s.xcconfig              = { 'HEADER_SEARCH_PATHS' => '"${PODS_ROOT}/onnxruntime-c/Headers"' }
            s.frameworks            = 'Foundation', 'CoreML'
            s.libraries             = 'c++'
          end
          EOF

          cat << 'EOF' > /tmp/ort-test/Podfile
          platform :ios, '15.1'
          target 'TestApp' do
            pod 'onnxruntime-c', :podspec => '/tmp/ort-cache/onnxruntime-c.podspec'
          end
          EOF
          (cd /tmp/ort-test && pod install)
          rm -rf /tmp/ort-test

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack for Yarn 1
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Create missing config files & patch Podfile
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          mkdir -p ios/Config
          if [ -f ios/Config/Env.xcconfig.example ]; then
            cp ios/Config/Env.xcconfig.example ios/Config/Env.xcconfig
          elif [ ! -f ios/Config/Env.xcconfig ]; then
            echo '#include? "../tmp.xcconfig"' > ios/Config/Env.xcconfig
          fi

          cat << 'EOF' > ios/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyDummyKeyForUnsignedBuild12345</string>
            <key>GCM_SENDER_ID</key><string>123456789012</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.pocketpalai</string>
            <key>PROJECT_ID</key><string>pocketpal-dummy</string>
            <key>STORAGE_BUCKET</key><string>pocketpal-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:123456789012:ios:1234567890abcdef</string>
          </dict>
          </plist>
          EOF
          cp ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist

          python3 -c '
          p = "ios/Podfile"
          txt = open(p).read()
          inject = "  pod \x27onnxruntime-c\x27, :podspec => \x27/tmp/ort-cache/onnxruntime-c.podspec\x27\n"
          if "onnxruntime-c" not in txt:
              txt = txt.replace("target \x27PocketPal\x27 do\n", "target \x27PocketPal\x27 do\n" + inject, 1)
              open(p, "w").write(txt)
          '

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned Release app
        run: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            GCC_OPTIMIZATION_LEVEL=s \
            ASSETCATALOG_COMPILER_OPTIMIZATION=space

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r PocketPal-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
