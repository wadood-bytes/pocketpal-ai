name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

            - name: Prepare & verify onnxruntime-c 1.24.3 (15-sec test)
        run: |
          mkdir -p /tmp/ort-cache/raw /tmp/ort-cache/pod/Headers /tmp/bin /tmp/ort-test

          ASSET_URL=$(/usr/bin/curl -fsSL "https://api.github.com/repos/microsoft/onnxruntime-swift-package-manager/releases?per_page=5" \
            | jq -r '[.[] | .assets[] | select(.name | endswith(".zip")) | .browser_download_url][0]')

          echo "Downloading iOS binary from: $ASSET_URL"
          /usr/bin/curl -fL "$ASSET_URL" -o /tmp/ort-cache/ort-ios.zip
          unzip -q /tmp/ort-cache/ort-ios.zip -d /tmp/ort-cache/raw

          XCFW=$(find /tmp/ort-cache/raw -name "onnxruntime.xcframework" -type d | head -n 1)
          cp -r "$XCFW" /tmp/ort-cache/pod/onnxruntime.xcframework
          find /tmp/ort-cache/pod/onnxruntime.xcframework -name "*.h" -exec cp {} /tmp/ort-cache/pod/Headers/ \;
          (cd /tmp/ort-cache/pod && zip -qr /tmp/ort-cache/pod-archive-onnxruntime-c-1.24.3.zip .)

          cat << 'EOF' > /tmp/bin/curl
          #!/bin/bash
          OUT=""
          IS_ORT=0
          PREV=""
          for arg in "$@"; do
            if [ "$PREV" = "-o" ]; then OUT="$arg"; fi
            if [[ "$arg" == *"pod-archive-onnxruntime-c-1.24.3.zip"* ]]; then IS_ORT=1; fi
            PREV="$arg"
          done
          if [ "$IS_ORT" -eq 1 ] && [ -n "$OUT" ]; then
            mkdir -p "$(dirname "$OUT")"
            cp /tmp/ort-cache/pod-archive-onnxruntime-c-1.24.3.zip "$OUT"
            exit 0
          fi
          REAL_CURL="/usr/local/opt/curl/bin/curl"
          [ -x "$REAL_CURL" ] || REAL_CURL="/usr/bin/curl"
          exec "$REAL_CURL" "$@"
          EOF
          chmod +x /tmp/bin/curl
          echo "/tmp/bin" >> $GITHUB_PATH

          export PATH="/tmp/bin:$PATH"
          cat << 'EOF' > /tmp/ort-test/Podfile
          platform :ios, '15.1'
          target 'TestApp' do
            pod 'onnxruntime-c', '1.24.3'
          end
          EOF
          (cd /tmp/ort-test && pod install)
          rm -rf /tmp/ort-test
          # 3. Create curl interceptor for dead download.onnxruntime.ai URL
          cat << 'EOF' > /tmp/bin/curl
          #!/bin/bash
          OUT=""
          IS_ORT=0
          PREV=""
          for arg in "$@"; do
            if [ "$PREV" = "-o" ]; then OUT="$arg"; fi
            if [[ "$arg" == *"pod-archive-onnxruntime-c-1.24.3.zip"* ]]; then IS_ORT=1; fi
            PREV="$arg"
          done
          if [ "$IS_ORT" -eq 1 ] && [ -n "$OUT" ]; then
            mkdir -p "$(dirname "$OUT")"
            cp /tmp/ort-cache/pod-archive-onnxruntime-c-1.24.3.zip "$OUT"
            exit 0
          fi
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/bin/curl
          echo "/tmp/bin" >> $GITHUB_PATH

          # 4. Run instant 15-second CocoaPods verification test before slow steps
          export PATH="/tmp/bin:$PATH"
          cat << 'EOF' > /tmp/ort-test/Podfile
          platform :ios, '15.1'
          target 'TestApp' do
            pod 'onnxruntime-c', '1.24.3'
          end
          EOF
          (cd /tmp/ort-test && pod install)
          rm -rf /tmp/ort-test

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack for Yarn 1
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Create missing config files
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          mkdir -p ios/Config
          if [ -f ios/Config/Env.xcconfig.example ]; then
            cp ios/Config/Env.xcconfig.example ios/Config/Env.xcconfig
          elif [ ! -f ios/Config/Env.xcconfig ]; then
            echo '#include? "../tmp.xcconfig"' > ios/Config/Env.xcconfig
          fi

          cat << 'EOF' > ios/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyDummyKeyForUnsignedBuild12345</string>
            <key>GCM_SENDER_ID</key><string>123456789012</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.pocketpalai</string>
            <key>PROJECT_ID</key><string>pocketpal-dummy</string>
            <key>STORAGE_BUCKET</key><string>pocketpal-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:123456789012:ios:1234567890abcdef</string>
          </dict>
          </plist>
          EOF
          cp ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned Release app
        run: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            GCC_OPTIMIZATION_LEVEL=s \
            ASSETCATALOG_COMPILER_OPTIMIZATION=space

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r PocketPal-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
