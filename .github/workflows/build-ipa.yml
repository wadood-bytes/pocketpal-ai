name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare & verify onnxruntime-c 1.24.3 (15-sec test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ort-cache/raw /tmp/ort-cache/pkg/Headers /tmp/ort-test

          # 1. Clone Microsoft's official iOS SPM repo (uses git, never api.github.com)
          git clone --depth 1 https://github.com/microsoft/onnxruntime-swift-package-manager.git /tmp/ort-spm
          ASSET_URL=$(grep -Eo 'https://[^"]*\.zip' /tmp/ort-spm/Package.swift | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "Could not find zip URL in Package.swift:"
            cat /tmp/ort-spm/Package.swift
            exit 1
          fi

          echo "Downloading official iOS binary from: $ASSET_URL"
          curl -fL "$ASSET_URL" -o /tmp/ort-cache/ort-ios.zip
          unzip -q /tmp/ort-cache/ort-ios.zip -d /tmp/ort-cache/raw

          # 2. Extract onnxruntime.xcframework + public headers into a clean local package
          XCFW=$(find /tmp/ort-cache/raw -name "*.xcframework" -type d | head -n 1)
          if [ -z "$XCFW" ]; then
            echo "No xcframework found in archive:"
            find /tmp/ort-cache/raw -maxdepth 3
            exit 1
          fi

          cp -r "$XCFW" /tmp/ort-cache/pkg/onnxruntime.xcframework
          find /tmp/ort-cache/pkg/onnxruntime.xcframework -name "*.h" -exec cp {} /tmp/ort-cache/pkg/Headers/ \;
          (cd /tmp/ort-cache/pkg && zip -qr /tmp/ort-cache/ort-pod.zip .)

          # 3. Create local CocoaPods spec so pod install never hits dead download.onnxruntime.ai
          cat << 'EOF' > /tmp/ort-cache/onnxruntime-c.podspec
          Pod::Spec.new do |s|
            s.name                  = 'onnxruntime-c'
            s.version               = '1.24.3'
            s.summary               = 'ONNX Runtime C/C++ iOS framework'
            s.homepage              = 'https://onnxruntime.ai'
            s.license               = { :type => 'MIT' }
            s.author                = 'Microsoft'
            s.source                = { :http => 'file:///tmp/ort-cache/ort-pod.zip' }
            s.ios.deployment_target = '13.0'
            s.vendored_frameworks   = 'onnxruntime.xcframework'
            s.preserve_paths        = 'onnxruntime.xcframework/**/*'
            s.source_files          = 'Headers/*.h'
            s.public_header_files   = 'Headers/*.h'
            s.xcconfig              = { 'HEADER_SEARCH_PATHS' => '"${PODS_ROOT}/onnxruntime-c/Headers"' }
            s.frameworks            = 'Foundation', 'CoreML'
            s.libraries             = 'c++'
          end
          EOF

          # 4. Run 15-second CocoaPods verification before slow steps
          cat << 'EOF' > /tmp/ort-test/Podfile
          platform :ios, '15.1'
          target 'TestApp' do
            pod 'onnxruntime-c', :podspec => '/tmp/ort-cache/onnxruntime-c.podspec'
          end
          EOF
          (cd /tmp/ort-test && pod install)
          rm -rf /tmp/ort-test /tmp/ort-spm

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack for Yarn 1
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Create missing config files & patch Podfile
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          mkdir -p ios/Config
          if [ -f ios/Config/Env.xcconfig.example ]; then
            cp ios/Config/Env.xcconfig.example ios/Config/Env.xcconfig
          elif [ ! -f ios/Config/Env.xcconfig ]; then
            echo '#include? "../tmp.xcconfig"' > ios/Config/Env.xcconfig
          fi

          cat << 'EOF' > ios/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyDummyKeyForUnsignedBuild12345</string>
            <key>GCM_SENDER_ID</key><string>123456789012</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.pocketpalai</string>
            <key>PROJECT_ID</key><string>pocketpal-dummy</string>
            <key>STORAGE_BUCKET</key><string>pocketpal-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:123456789012:ios:1234567890abcdef</string>
          </dict>
          </plist>
          EOF
          cp ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist

          # Point Podfile to our verified local onnxruntime-c podspec
          python3 -c "
          p = 'ios/Podfile'
          txt = open(p).read()
          inject = \"  pod 'onnxruntime-c', :podspec => '/tmp/ort-cache/onnxruntime-c.podspec'\n\"
          if 'onnxruntime-c' not in txt:
              txt = txt.replace(\"target 'PocketPal' do\n\", \"target 'PocketPal' do\n\" + inject, 1)
              open(p, 'w').write(txt)
          "

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build unsigned Release app
        run: |
          cd ios
          xcodebuild -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            GCC_OPTIMIZATION_LEVEL=s \
            ASSETCATALOG_COMPILER_OPTIMIZATION=space

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r PocketPal-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: PocketPal-unsigned.ipa
